<script>
let tripA=null,tripB=null,params={};

const MSGS=['Chargement de votre voyageâ€¦','Mise en forme des rÃ©sultatsâ€¦','Presque prÃªtâ€¦'];
let msgTimer=null;

window.addEventListener('DOMContentLoaded',()=>{
  params=JSON.parse(sessionStorage.getItem('horizons_params')||'{}');
  const stored=sessionStorage.getItem('horizons_tripA');
  if(stored){

    catch(e){showError('DonnÃ©es corrompues. Revenez Ã  la recherche.');}

    showError('Aucun voyage trouvÃ©. Revenez Ã  la page de recherche.');

function showTrip(trip){

async function generateAlt(){
  const apiKey=localStorage.getItem('horizons_api_key');
  if(!apiKey){alert('ClÃ© API manquante. Retournez sur la page de recherche.');return;}
  document.getElementById('altBtn').style.display='none';

  try{
    const seed=Math.random().toString(36).slice(2,10);

    tripB=await callAPI(apiKey,msg);

function onSlider(v){document.getElementById('tripsInner').style.transform=`translateX(-${v}%)`;}

async function callAPI(apiKey,userMsg){
  const SYS=`Tu es un expert planificateur de voyages crÃ©atif. GÃ©nÃ¨re un voyage UNIQUE Ã  chaque appel.
RÃ©ponds UNIQUEMENT en JSON valide. Aucun texte avant/aprÃ¨s. Aucun backtick.
Format: {"destination":"Ville, Pays","country_code":"JP","lat":35.68,"lng":139.69,"title":"Titre poÃ©tique","duration":"8 jours","season":"Avril","vibe":"Culture & Gastronomie","unsplash_query":"tokyo japan","flights":[{"type":"Aller","airline":"Swiss","route":"GVAâ†’NRT","dep":"10:35","arr":"06:20+1","duration":"12h45","stops":"Direct","price_pp":680,"tip":"conseil"}],"hotels":[{"name":"Nom","stars":4,"area":"Quartier","style":"Boutique","price_night":145,"perks":["wifi","vue"],"tip":"conseil"}],"activities":[{"name":"Nom","category":"Culture","duration":"3h","price_pp":0,"when":"Matin","desc":"description","must":true}],"restaurants":[{"name":"Nom","cuisine":"Type","price":"â‚¬â‚¬","specialty":"plat","area":"Quartier","tip":"conseil"}],"budget":{"flights":1360,"hotels":1160,"activities":280,"food":400,"transport":120,"misc":180,"currency":"EUR","note":"note"},"itinerary":[{"day":1,"label":"ArrivÃ©e","items":[{"time":"15:00","act":"Transfert hÃ´tel"}]}],"tips":{"visa":"info","weather":"mÃ©tÃ©o","currency":"monnaie","timezone":"UTC+X","language":"langue","emergency":"112"}}`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,system:SYS,messages:[{role:'user',content:userMsg}]})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error?.message||`HTTP ${r.status}`);}
  const d=await r.json();
  const raw=d.content?.filter(b=>b.type==='text').map(b=>b.text).join('')||'';
  return JSON.parse(raw.replace(/```json|```/g,'').trim());
}

function renderPanel(el,t){
  const imgQ=encodeURIComponent(t.unsplash_query||t.destination||'travel');
  el.innerHTML=`
    <div class="trip-hero">
      <img src="https://source.unsplash.com/featured/1200x500/?${imgQ}" alt="${esc(t.destination)}" onerror="this.src='https://source.unsplash.com/featured/1200x500/?travel'">
      <div class="trip-hero-body">
        <div class="trip-title">${esc(t.title||t.destination)}</div>
        <div class="trip-badges">
          ${t.destination?`<span class="badge badge-blue"><i class="ti ti-map-pin"></i>${esc(t.destination)}</span>`:''}
          ${t.duration?`<span class="badge badge-green"><i class="ti ti-calendar"></i>${esc(t.duration)}</span>`:''}
          ${t.season?`<span class="badge badge-amber"><i class="ti ti-sun"></i>${esc(t.season)}</span>`:''}

      </div>
    </div>
    ${sec('ic-flight','ti-plane','Vols',flights(t.flights),t.flights?.length)}
    ${sec('ic-hotel','ti-building','HÃ´tels',hotels(t.hotels),t.hotels?.length)}
    ${sec('ic-act','ti-map-pin','ActivitÃ©s',activities(t.activities),t.activities?.length)}
    ${sec('ic-food','ti-tools-kitchen-2','Restaurants',restaurants(t.restaurants),t.restaurants?.length)}
    ${sec('ic-budget','ti-coin','Budget',budget(t.budget))}
    ${sec('ic-iti','ti-calendar','ItinÃ©raire',itinerary(t.itinerary),t.itinerary?.length+' jours')}

    ${sec('ic-tips','ti-info-circle','Conseils',tips(t.tips))}`;

}
function flights(arr=[]){

function hotels(arr=[]){

function activities(arr=[]){
  return arr.map(a=>`<div class="mini-card"><div class="mc-top"><span class="mc-name">${esc(a.name)}${a.must?` <span class="badge badge-coral" style="font-size:10px">Ã€ faire</span>`:''}</span><span class="mc-price">${a.price_pp>0?fmt(a.price_pp)+'â‚¬':'Gratuit'}</span></div><div class="mc-sub">${esc(a.category)} Â· ${esc(a.duration)} Â· ${esc(a.when)}</div><div class="mc-sub" style="margin-top:5px">${esc(a.desc)}</div></div>`).join('')||'<p class="mc-sub">Aucune activitÃ©.</p>';

function budget(b={}){
  const tot=Math.round((b.flights||0)+(b.hotels||0)+(b.activities||0)+(b.food||0)+(b.transport||0)+(b.misc||0));
  const lines=[['Vols',b.flights,'#378ADD'],['HÃ´tels',b.hotels,'#7F77DD'],['ActivitÃ©s',b.activities,'#1D9E75'],['Restauration',b.food,'#BA7517'],['Transport',b.transport,'#888780'],['Divers',b.misc,'#D4537E']];
  return lines.map(([l,v,c])=>`<div class="budget-row"><span class="b-lbl">${l}</span><div class="b-track"><div class="b-fill" style="width:${tot>0?Math.round(((v||0)/tot)*100):0}%;background:${c}"></div></div><span class="b-amt">${fmt(v||0)}â‚¬</span></div>`).join('')+`<div class="b-total"><span>Total estimÃ©</span><span>${fmt(tot)}â‚¬</span></div>${b.note?`<div class="b-note">â„¹ï¸ ${esc(b.note)}</div>`:''}`;

function map(t){
  const lat=parseFloat(t.lat)||48.8,lng=parseFloat(t.lng)||2.35;
  const cx=Math.max(10,Math.min(390,Math.round(((lng+180)/360)*400)));
  const cy=Math.max(10,Math.min(190,Math.round(((90-lat)/180)*200)));
  return `<div class="map-wrap"><svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block"><rect width="400" height="200" fill="#f0f0ee"/><ellipse cx="200" cy="100" rx="195" ry="93" fill="#e8e8e2" stroke="#d8d8d2" stroke-width=".5"/><ellipse cx="60" cy="82" rx="35" ry="22" fill="#d4d4ce" opacity=".8"/><ellipse cx="200" cy="72" rx="55" ry="36" fill="#d4d4ce" opacity=".8"/><ellipse cx="295" cy="72" rx="28" ry="22" fill="#d4d4ce" opacity=".8"/><ellipse cx="330" cy="108" rx="22" ry="28" fill="#d4d4ce" opacity=".8"/><ellipse cx="125" cy="105" rx="28" ry="18" fill="#d4d4ce" opacity=".8"/><ellipse cx="135" cy="135" rx="18" ry="24" fill="#d4d4ce" opacity=".8"/><circle cx="${cx}" cy="${cy}" r="10" fill="#E24B4A" opacity=".25"/><circle cx="${cx}" cy="${cy}" r="5" fill="#E24B4A"/><circle cx="${cx}" cy="${cy}" r="2" fill="#fff"/><text x="${cx+12}" y="${cy+4}" font-size="10" fill="#1c1c1e" font-family="sans-serif">${esc(t.destination||'')}</text></svg><div class="map-coords">${lat.toFixed(2)}Â°N, ${lng.toFixed(2)}Â°E</div></div>`;
}
function tips(t={}){
  const items=[['ti-id','Visa',t.visa],['ti-cloud','MÃ©tÃ©o',t.weather],['ti-coin','Monnaie',t.currency],['ti-clock','Fuseau',t.timezone],['ti-message','Langue',t.language],['ti-phone','Urgences',t.emergency]].filter(i=>i[2]);
  return items.length?`<div class="tips-grid">${items.map(i=>`<div class="tip-card"><i class="ti ${i[0]}"></i><div class="tip-lbl">${i[1]}</div><div class="tip-val">${esc(i[2])}</div></div>`).join('')}</div>`:'<p class="mc-sub">Aucun conseil.</p>';
}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return Math.round(Number(n)||0).toLocaleString('fr-FR');}
function showToast(msg){const t=document.createElement('div');t.textContent=msg;Object.assign(t.style,{position:'fixed',bottom:'1.5rem',right:'1.5rem',background:'#1c1c1e',color:'#fff',padding:'10px 18px',borderRadius:'30px',fontSize:'13px',zIndex:'999',opacity:'0',transition:'opacity .2s'});document.body.appendChild(t);requestAnimationFrame(()=>{t.style.opacity='1';});setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);}
</script>
